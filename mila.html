<style>
html, body {
    margin: 0;
    padding: 0;
    background: #transparted; /* Sfondo nero per far risaltare l'arcobaleno */
}

/* CONTENITORI VIDEO */
.video-box {
    position: fixed;
    width: 240px;
    height: 520px;
    top: 50%;
    transform: translateY(-50%);
    border-radius: 14px; /* Nota: border-image a volte ignora il radius, usiamo overflow hidden */

    /* EFFETTO ARCOBALENO 10PX */
    border: 10px solid;
    border-image-slice: 1;
    border-image-source: linear-gradient(to bottom right, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #8f00ff);

    overflow: hidden;
    z-index: 9999;
    box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
}

/* POSIZIONE */
.video-left { left: 10px; }
.video-right { right: 10px; }

/* VIDEO */
.video-box video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

/* TESTO */
.video-text {
    position: absolute;
    bottom: 12px; /* Alzato leggermente per via del bordo più spesso */
    left: 0;
    width: 100%;
    text-align: center;
    color: #fff;
    font-size: 22px;
    font-weight: bold;
    text-shadow: 0 0 8px #fff;
    pointer-events: none;
    animation: wave 3s ease-in-out infinite;
}

/* ANIMAZIONE ONDA */
@keyframes wave {
    0% { transform: translateY(0) rotate(0deg); }
    25% { transform: translateY(-4px) rotate(-1deg); }
    50% { transform: translateY(0) rotate(0deg); }
    75% { transform: translateY(4px) rotate(1deg); }
    100% { transform: translateY(0) rotate(0deg); }
}
</style>
</head>

<body>

<div class="video-box video-left">
    <video autoplay loop muted playsinline>
        <source src="https://i.imgur.com/T7H7nqw.mp4" type="video/mp4">
    </video>
    <div class="video-text"></div>
</div>

<div class="video-box video-right">
    <video autoplay loop muted playsinline>
        <source src="https://i.imgur.com/T7H7nqw.mp4" type="video/mp4">
    </video>
    <div class="video-text"></div>
</div>

</body>
</html>
